# scripts/patches/ns3/CAPABILITY_MATRIX.yaml
# schema: capability-matrix-v1
#
# PURPOSE
# -------
# This file is the authoritative registry of CORNET-exposed NS-3/NR features.
# It is NOT parsed at install time. It is maintained by CORNET maintainers when
# a new NR version is validated or a new feature is integrated.
#
# CAPABILITY LEVELS
# -----------------
# upstream-available : Feature exists in NR upstream; CORNET has no patches/scripts/
#                      config fields for it yet. Requires manual work to use.
# cornet-integrated  : CORNET patches, scratch scripts, or config.yaml expose the
#                      feature. Not yet exercised end-to-end.
# cornet-validated   : Feature has been exercised end-to-end under make validate-*
#                      with a real leaderboard entry.
#
# PATCH TYPES
# -----------
# infrastructure    : Enables CORNET middleware (PDCP timestamps, dispatcher hooks).
#                     SHALL be rebased when promoting to any new default lane.
# research-feature  : Adds custom research code (EDF/AoI schedulers).
#                     Rebased ONLY when there is a documented research reason to move.
# upstream-feature  : Uses upstream NR functionality; no CORNET patches needed.
#
# SUPPORTED_IN
# ------------
# Each capability carries a list of patch sets where it is available.
# A feature is satisfiable if ANY entry matches the installed lane.

capabilities:

  # ─── infrastructure patches (applied to all CORNET installs) ──────────────────

  - name: pdcp_aoi_timestamps
    type: infrastructure
    nr_introduced: "2.4"
    supported_in:
      - patch_set: v2.4-ns3.38
        patches: [ns3_lte_pdcp.patch]
        level: cornet-validated
      - patch_set: v4.2-ns3.47
        patches: [nr_pdcp_aoi.patch]
        level: cornet-integrated
      - patch_set: v5.1-ns3.48
        patches: [nr_pdcp_aoi.patch]
        level: cornet-integrated
    config_fields: []
    notes: >
      On NR >= v3.2 the NR bearer uses NrPdcp, which already carries a sender
      timestamp (NrPdcpTag). ns3_lte_pdcp.patch does not affect those bearers.
      nr_pdcp_aoi.patch adds PDCP repetitions and duplicate filtering on NrPdcp.
      The v2.4 row remains the LTE PDCP instrumentation.

  - name: cornet_tap_bridge_contract
    type: infrastructure
    nr_introduced: "2.4"
    supported_in:
      - patch_set: v2.4-ns3.38
        patches: [ns3_lte_pdcp.patch]
        level: cornet-validated
      - patch_set: v4.2-ns3.47
        patches: [ns3_lte_pdcp.patch]
        level: cornet-integrated
      - patch_set: v5.1-ns3.48
        patches: [ns3_lte_pdcp.patch]
        level: cornet-integrated
    config_fields:
      - network.middleware.enabled
      - network.middleware.ip_list
      - network.middleware.sensor_port
      - network.middleware.control_port
    contract: |
      Scratch scripts MUST parse --tun{i}=name,ip CLI args (one per ip_list entry).
      TapBridgeHelper names come from the arg values — NOT hard-coded "tap-robot" etc.
      TAP bridge count equals --tun{i} arg count, NOT numUes.
      --sensorPort and --controlPort are forwarded from MiddlewareConfig schema fields.
      Scripts that ignore --tun{i} args are incompatible with middleware.enabled=true.

  # ─── research-feature patches (domain-scoped) ─────────────────────────────────
  # Migration policy: rebased ONLY when there is a documented research reason.
  # These are inert for CSI-RS, MIMO, and fronthaul experiments even when applied.

  - name: custom_edf_scheduler
    type: research-feature
    domain: aoi-measurement, deadline-scheduling
    nr_introduced: "2.4"
    supported_in:
      - patch_set: v2.4-ns3.38
        patches: [nr_schedulers.patch]
        level: cornet-validated
      - patch_set: v4.2-ns3.47
        patches: [nr_schedulers.patch]
        level: cornet-validated   # pendulum_nr_control@ns3-v47 SUCCESS, schedulerType edf
      - patch_set: v5.1-ns3.48
        patches: [nr_schedulers.patch]
        level: cornet-integrated
    config_fields:
      - network.scenario.scheduler   # set to "ofdma-edf" or "edf"
    notes: >
      EDF MAC scheduler. Scoped to AoI and deadline-scheduling experiments.
      Inert in CSI-RS, MIMO, and fronthaul experiments even when applied.
      nr_schedulers.patch remains the full-profile patch. nr_edf_only.patch
      applies on its own; AoI builds still need it because AoI subclasses EDF.

  - name: aoi_mac_scheduler
    type: research-feature
    domain: aoi-measurement
    nr_introduced: "2.4"
    supported_in:
      - patch_set: v2.4-ns3.38
        patches: [nr_schedulers.patch]
        level: cornet-validated
      - patch_set: v4.2-ns3.47
        patches: [nr_schedulers.patch]
        level: cornet-validated   # pendulum_aoi_scheduler@ns3-v47 SUCCESS, schedulerType aoi
      - patch_set: v5.1-ns3.48
        patches: [nr_schedulers.patch]
        level: cornet-integrated
    config_fields:
      - network.scenario.scheduler   # set to "ofdma-aoi" or "aoi"
    notes: >
      AoI-aware MAC scheduler. nr_aoi_only.patch applies independently of the
      combined nr_schedulers.patch. A build still needs nr_edf_only.patch
      first, because the AoI classes subclass the EDF classes.

  # ─── upstream-only features (no CORNET patches required) ──────────────────────

  - name: xr_traffic_models
    type: upstream-feature
    nr_introduced: "2.4"
    supported_in:
      - patch_set: v2.4-ns3.38
        patches: []
        level: cornet-integrated
    config_fields: []
    notes: >
      NGMN and 3GPP XR (VR/AR/CG) traffic generators. Available in NR v2.4
      traffic-generators/ directory. Not yet surfaced in CORNET config.yaml or
      scratch scripts.

  - name: qos_flow_api
    type: upstream-feature
    nr_introduced: "4.0"
    supported_in:
      - patch_set: v4.2-ns3.47
        patches: []
        level: cornet-integrated
    config_fields: []
    notes: >
      NrEpsBearer renamed to NrQosFlow in NR v4.0; NrEpcTft renamed to NrQosRule.
      Scratch script rebased to use new names. No CORNET patch required.

  - name: subband_csi
    type: upstream-feature
    nr_introduced: "4.0"
    supported_in:
      - patch_set: v4.2-ns3.47
        patches: []
        level: upstream-available
    config_fields: []
    notes: >
      Sub-band CQI reporting introduced in NR v4.0. Not yet integrated into CORNET
      scratch scripts or config.yaml. No CORNET patches required. Use v4.2 lane.
      Future: PATCH_PROFILE=infrastructure (no scheduler patches) is appropriate.

  - name: csi_rs_measurements
    type: upstream-feature
    nr_introduced: "4.0"
    supported_in:
      - patch_set: v4.2-ns3.47
        patches: []
        level: upstream-available
    config_fields: []
    notes: >
      CSI-RS signals and CSI-IM interference measurements introduced in NR v4.0.
      No CORNET patches required. Use v4.2 lane. nr_schedulers.patch is inert
      for these experiments but will be present (full patch profile default).
      Future: PATCH_PROFILE=infrastructure will allow opting out of scheduler code.

  - name: kronecker_beamforming
    type: upstream-feature
    nr_introduced: "4.0"
    supported_in:
      - patch_set: v4.2-ns3.47
        patches: []
        level: upstream-available
    config_fields: []
    notes: >
      KroneckerBeamforming and KroneckerQuasiOmniBeamforming introduced in NR v4.0.
      No CORNET patches required. Not yet surfaced in config.yaml.

  - name: reinforcement_learning_scheduler
    type: upstream-feature
    nr_introduced: "4.0"
    supported_in:
      - patch_set: v4.2-ns3.47
        patches: []
        level: upstream-available
    config_fields: []
    notes: >
      NrMacSchedulerTdmaAi and NrMacSchedulerOfdmaAi (ns3-gym based) introduced
      in NR v4.0 (GSoC 2024 contribution). No CORNET patches required.
      Requires ns3-gym module to be installed separately.

  # ─── upstream features from NR v2.5–v4.2 release notes ────────────────────────
  # Maintainer input: cttc-lena/nr CHANGES.md at tag v4.2. Not cornet-integrated.

  - name: qos_mac_scheduler
    type: upstream-feature
    nr_introduced: "2.5"
    supported_in:
      - patch_set: v4.2-ns3.47
        patches: []
        level: upstream-available
    config_fields: []
    notes: >
      NrMacSchedulerOfdmaQos and NrMacSchedulerTdmaQos schedule from QoS flow
      requirements. Not in the v2.4 tree and not exposed by CORNET config.

  - name: su_mimo
    type: upstream-feature
    nr_introduced: "3.0"
    supported_in:
      - patch_set: v4.2-ns3.47
        patches: []
        level: upstream-available
    config_fields: []
    notes: >
      General SU-MIMO model that replaced DP-MIMO in NR v3.0, including
      Type-I codebook search from v3.1. No CORNET scratch or config support.

  - name: nr_pdcp
    type: upstream-feature
    nr_introduced: "3.2"
    supported_in:
      - patch_set: v4.2-ns3.47
        patches: []
        level: upstream-available
    config_fields: []
    notes: >
      NR uses its own PDCP from v3.2. ns3_lte_pdcp.patch instruments LTE PDCP
      only, so AoI timestamps on NR bearers are not provided by that patch.

  - name: fronthaul_control
    type: upstream-feature
    nr_introduced: "3.3"
    supported_in:
      - patch_set: v4.2-ns3.47
        patches: []
        level: upstream-available
    config_fields: []
    notes: >
      NrFhControl simulates a limited-capacity fronthaul link. EnableFhControl
      exists on the v4.2 lane. CORNET does not expose it.

  - name: nr_channel_helper
    type: upstream-feature
    nr_introduced: "4.0"
    supported_in:
      - patch_set: v4.2-ns3.47
        patches: []
        level: upstream-available
    config_fields: []
    notes: >
      NrChannelHelper configures 3GPP, NYUSIM, and fluctuating two-ray channels.
      Not wrapped by a CORNET scenario profile.

  - name: hex_wraparound
    type: upstream-feature
    nr_introduced: "4.1"
    supported_in:
      - patch_set: v4.2-ns3.47
        patches: []
        level: upstream-available
      - patch_set: v5.1-ns3.48
        patches: []
        level: cornet-integrated
    config_fields: []
    notes: >
      HexagonalGridScenarioHelper::InstallWraparound. The v5.1 scratch template
      accepts --wraparound with --hexSites of 1, 7, or 19. v2.4 has no wrap-around.

  - name: nr_handover
    type: upstream-feature
    nr_introduced: "5.0"
    supported_in:
      - patch_set: v5.1-ns3.48
        patches: []
        level: upstream-available
    config_fields: []
    notes: >
      NR handover, including HandoverTotalTime, arrived in 5G-LENA v5.0 and is
      in the pinned v5.1 commit cedceadda17392c90587fb9400eb9b1f8c236713.
      Promoted to cornet-validated only after the validate-v51 smoke and a
      co-simulation that exercises handover. NS-3 pin d2add90b452d600cfb4859baed8e9ea633519447.

  - name: blockage_model_a
    type: upstream-feature
    nr_introduced: "2.4"
    supported_in:
      - patch_set: v2.4-ns3.38
        patches: []
        level: cornet-integrated
      - patch_set: v4.2-ns3.47
        patches: []
        level: cornet-integrated
      - patch_set: v5.1-ns3.48
        patches: []
        level: cornet-integrated
    config_fields: []
    notes: >
      ThreeGppChannelModel Blockage attribute, TR 38.901 section 7.6.4.1 Model A.
      Scratch scripts accept --blockage.

  - name: channel_inf
    type: research-feature
    nr_introduced: "5.1"
    supported_in:
      - patch_set: v5.1-ns3.48
        patches: [ns3_channel_inf.patch]
        level: cornet-integrated
    config_fields: []
    notes: >
      InF-SL, InF-DL, InF-SH, and InF-DH registered on NR's channel helper.
      Uncalibrated. calibration/inf/VERDICT.md: the Table 7.4.1-1 anchor matches,
      but serving-cell medians were not checked against R1-1909704.
      Failing sub-scenarios: InF-SL, InF-DL, InF-SH, InF-DH.
      NS-3 pin d2add90b452d600cfb4859baed8e9ea633519447.
      NR pin cedceadda17392c90587fb9400eb9b1f8c236713.

  - name: channel_aerial_36777
    type: research-feature
    nr_introduced: "5.1"
    supported_in:
      - patch_set: v5.1-ns3.48
        patches:
          - ns3_channel_aerial_36777.patch
        level: cornet-integrated
    config_fields: []
    notes: >
      Scope is aerial path loss only. ns3_channel_aerial_36777.patch adds
      TR 36.777 UMa-AV, UMi-AV, and RMa-AV path loss and LOS probability.
      Fast fading stays the terrestrial model. A flat network value of
      UMa-AV, UMi-AV, or RMa-AV writes that caveat into provenance.json.
      Not exercised by a leaderboard run. NS-3 pin
      d2add90b452d600cfb4859baed8e9ea633519447.

  - name: sionna_rt
    type: upstream-feature
    nr_introduced: "5.1"
    supported_in:
      - patch_set: v5.1-ns3.48
        patches: []
        level: upstream-available
    config_fields: []
    notes: >
      Optional Sionna RT hooks in the pinned NS-3 3.48 tree
      d2add90b452d600cfb4859baed8e9ea633519447. Not wrapped by a CORNET script.

  - name: blockage_model_b
    type: upstream-feature
    nr_introduced: "5.1"
    supported_in: []
    config_fields: []
    notes: >
      Deferred. TR 38.901 Blockage Model B is not implemented on any CORNET lane.
