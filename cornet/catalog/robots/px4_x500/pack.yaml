name: px4_x500
kind: robots
version: "1"
description: >
  PX4 quadrotor on Gazebo Classic SITL. The smoked checkout is
  ~/simulation/PX4-Autopilot at 36006b6 (main, 2026-03-20), airframe iris.
  Classic models ship iris, not x500; x500 is the gz-sim airframe.
  The classic target is `make px4_sitl gazebo-classic` (iris).
  PX4's own SITL lockstep is independent of the deferred CORNET conductor.
provides:
  metric: position_rms
requires:
  gazebo: classic-11
  ros: humble
  root: false
compatible:
  worlds: [open_plain, warehouse_small]
  networks: [nr]
license:
  spdx: BSD-3-Clause
  vendored: false
  provenance: >
    PX4-Autopilot 36006b6d703a421175587d386a535bbdf8eb0a9c at
    ~/simulation/PX4-Autopilot. Tools/simulation/gazebo-classic/sitl_gazebo-classic
    is submodule PX4-SITL_gazebo-classic 5b6966ed572a02e8273f446acb504a45a841ca53.
    enable_lockstep in gazebo_mavlink_interface waits on HIL_ACTUATOR_CONTROLS.
    Built binary: build/px4_sitl_default/bin/px4.
  source_url: https://github.com/PX4/PX4-Autopilot
network_flows:
  - name: mavlink_setpoint
    direction: controller_to_robot
    topic: mavlink
    rate_hz: 50
    size_bytes: 64
  - name: mavlink_telemetry
    direction: robot_to_controller
    topic: mavlink
    rate_hz: 10
    size_bytes: 128
physics_step_s: 0.004
count_min: 1
count_max: 1
intake_questions:
  - localisation (GPS, external pose, optical flow, or VIO)
  - control split (onboard mission or offboard over the network)
  - flight envelope (ceiling, max speed, aisle clearance)
  - mission (hover, aisle scan, follow ground robot)
  - link-loss policy (hold or land; RTL is rejected indoors)
notes: >
  Indoor flight requires the no-roof world variant. RTL indoors is rejected.
  The smoked tree is the CORNET2.0 iris SITL at ~/simulation/PX4-Autopilot.
  Classic SITL uses the iris airframe because that model set has no x500.
  The built binary also links libgz-transport13, libgz-msgs10, and libgz-utils2.
  `make install-px4` installs that checkout and those libraries. It is not
  part of plain `make install`.
