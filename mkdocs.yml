site_name: CORNET
site_description: Co-simulation framework for networked robots
site_url: https://rbccps-iisc.github.io/CORNET/
repo_url: https://github.com/rbccps-iisc/CORNET
repo_name: rbccps-iisc/CORNET
docs_dir: docs
theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
  features:
    - navigation.sections
    - navigation.expand
    - content.code.copy
    - toc.follow
markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
nav:
  - Home: index.md
  - Getting started: GETTING_STARTED.md
  - Installation: INSTALL.md
  - Architecture: ARCHITECTURE.md
  - Lineage: LINEAGE.md
  - Guides:
      - Publishing docs: guides/publishing-docs.md
      - Research session: guides/research-session.md
      - Writing a task: guides/writing-a-task.md
      - Custom plugin: guides/custom-plugin.md
      - Custom eval tool: guides/custom-eval-tool.md
      - Parameter sweep: guides/parameter-sweep.md
      - Middleware: guides/middleware.md
  - Reference:
      - CLI: reference/cli.md
      - Config schema: reference/config-schema.md
      - Leaderboard: reference/leaderboard-format.md
plugins:
  - search
